<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>골드 캐니언 보석</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
  :root{--wood1:#8b5a2b;--wood2:#5a3716;--gold:#e8b24a;--panel:rgba(55,28,10,.82)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    min-height:100vh;overflow-x:hidden;
    background:linear-gradient(180deg,#5fb4e6 0%,#a8d8f0 28%,#f7c27a 55%,#d9783e 78%,#7a3b1c 100%);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;color:#fff;
    display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;
  }
  #scenery{position:fixed;left:0;right:0;bottom:0;width:100%;height:45vh;z-index:0;pointer-events:none}
  main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:12px 16px 24px;width:100%}
  .title{
    margin:6px 0 2px;font-family:'Rye',Georgia,serif;font-size:clamp(26px,6vw,44px);letter-spacing:1px;
    color:#ffd34d;text-shadow:0 3px 0 #8a4b00,0 5px 0 #4a2600,0 8px 14px rgba(0,0,0,.45);text-align:center;line-height:1.05
  }
  .sub{font-size:14px;font-weight:700;color:#fff6dc;text-shadow:0 2px 3px rgba(0,0,0,.6);margin-bottom:10px;letter-spacing:4px}
  #hud{display:flex;gap:8px;margin-bottom:10px}
  .stat{flex:1;background:var(--panel);border:3px solid var(--gold);border-radius:14px;padding:6px 8px;text-align:center;box-shadow:0 4px 0 #3a1e08}
  .stat small{display:block;font-size:11px;color:#f5d8a0;letter-spacing:1px}
  .stat b{font-size:22px;font-weight:900}
  #bar{height:8px;border-radius:5px;background:rgba(0,0,0,.4);margin-top:4px;overflow:hidden}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#ffe066,#ff9d1a);transition:width .3s}
  #wrap{
    position:relative;padding:10px;border-radius:18px;
    background:repeating-linear-gradient(90deg,var(--wood1) 0 22px,#7d4f24 22px 24px),var(--wood1);
    border:5px solid var(--gold);box-shadow:0 8px 0 #3a1e08,0 14px 30px rgba(0,0,0,.45),inset 0 0 0 3px #4a2a0e;
  }
  canvas{display:block;border-radius:10px;background:rgba(40,20,6,.55);touch-action:none;cursor:pointer}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,8,0,.6);border-radius:14px;z-index:5}
  #overlay.show{display:flex}
  .card{background:linear-gradient(#7a4a1e,#4e2c0e);border:4px solid var(--gold);border-radius:18px;padding:22px 26px;text-align:center;max-width:85%;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .card h2{margin:0 0 6px;font-family:'Rye',Georgia,serif;color:#ffd34d;font-size:28px;text-shadow:0 3px 0 #4a2600}
  .card p{margin:6px 0 14px;font-size:15px;color:#ffeccc}
  #stars{font-size:38px;letter-spacing:6px;margin:4px 0;color:#ffd34d;text-shadow:0 2px 0 #7a4a00}
  #stars .off{color:rgba(255,255,255,.2);text-shadow:none}
  button{
    font:inherit;font-weight:900;font-size:16px;color:#4a2600;cursor:pointer;
    background:linear-gradient(#ffe27a,#f2a81d);border:3px solid #fff3c4;border-radius:12px;padding:10px 22px;
    box-shadow:0 4px 0 #8a4b00;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4b00}
  #tools{display:flex;gap:10px;margin-top:14px}
  #tools button{font-size:14px;padding:8px 16px}
  .help{margin-top:10px;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:center;line-height:1.6;max-width:520px}
</style>
</head>
<body>
<svg id="scenery" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <path d="M0 400 L0 210 L80 210 L95 170 L210 170 L225 215 L300 230 L340 140 L470 140 L490 200 L560 260 L700 250 L720 190 L830 190 L850 240 L960 250 L990 160 L1110 160 L1130 220 L1200 230 L1200 400Z" fill="#b5532a" opacity=".85"/>
  <path d="M0 400 L0 300 L150 280 L260 310 L420 290 L600 320 L780 295 L940 315 L1100 290 L1200 300 L1200 400Z" fill="#8a3a1a"/>
  <g fill="#3f6b2a">
    <path d="M140 300 v-70 a12 12 0 0 1 24 0 v70z M128 260 v-22 a8 8 0 0 1 16 0 v30z M160 255 v-30 a8 8 0 0 1 16 0 v22z"/>
    <path d="M1030 305 v-90 a14 14 0 0 1 28 0 v90z M1016 260 v-26 a9 9 0 0 1 18 0 v34z M1056 250 v-34 a9 9 0 0 1 18 0 v26z"/>
  </g>
</svg>
<main>
  <div class="title">GOLD CANYON GEMS</div>
  <div class="sub">골드 캐니언 보석</div>
  <div id="hud">
    <div class="stat"><small>레벨</small><b id="lv">1</b></div>
    <div class="stat" style="flex:2"><small>점수 / 목표 <span id="tg"></span></small><b id="sc">0</b><div id="bar"><div id="fill"></div></div></div>
    <div class="stat"><small>남은 이동</small><b id="mv">0</b></div>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="overlay"><div class="card">
      <h2 id="ovTitle"></h2>
      <div id="stars"></div>
      <p id="ovText"></p>
      <button id="ovBtn"></button>
    </div></div>
  </div>
  <div id="tools">
    <button id="hintBtn">💡 힌트</button>
    <button id="restartBtn">↻ 다시 시작</button>
    <button id="soundBtn">🔊 소리</button>
  </div>
  <div class="help">
    보석을 드래그하거나 두 개를 차례로 눌러 자리를 바꾸세요. 같은 보석 3개 이상을 한 줄로 맞추거나, 2×2 사각형으로 모으면 사라집니다.<br>
    보석은 원자번호 1~20번 원소예요. 색은 불꽃 색이에요: <b>Li</b> 빨강 · <b>B</b> 초록 · <b>S</b> 파랑 · <b>Na</b> 노랑 · <b>K</b> 보라 · <b>Ca</b> 주황<br>
    4개 = 줄무늬 보석(한 줄 제거) · L/T자 = 폭탄 보석(주변 제거) · 5개 = ⭐ 황금 코인(같은 색 전부 제거)
  </div>
</main>

<script>
(() => {
const N = 8, T = 6, SPD = 0.2;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

const GEM = [
  // 원자번호 1~20번 원소 중 불꽃 색으로 고른 원소들
  { c1:'#ff9aa8', c2:'#e3152f', c3:'#6e0010', sym:'Li', num:3 },   // 리튬 - 빨강 (불꽃 반응)
  { c1:'#a8f5b4', c2:'#1db544', c3:'#04501a', sym:'B',  num:5 },   // 붕소 - 초록 (붕소 화합물 불꽃)
  { c1:'#b0d8ff', c2:'#2272e6', c3:'#0a2a78', sym:'S',  num:16 },  // 황 - 파랑 (탈 때 파란 불꽃)
  { c1:'#fff3a8', c2:'#f0b000', c3:'#7a4f00', sym:'Na', num:11 },  // 나트륨 - 노랑
  { c1:'#efbfff', c2:'#a133dd', c3:'#420a70', sym:'K',  num:19 },  // 칼륨 - 보라
  { c1:'#ffd2a3', c2:'#f27a10', c3:'#6e2e00', sym:'Ca', num:20 },  // 칼슘 - 주황
];
const GOLD = '#ffd34d';

let S = 60, board = [], dying = [], parts = [], fx = [], texts = [];
let sel = null, drag = null, busy = true, level = 1, score = 0, target = 0, moves = 0, combo = 0;
let lastAct = 0, hint = null, showHint = false, time = 0, waiters = [], sound = true, ac = null;

// ---------- layout ----------
function resize() {
  const avail = Math.min(window.innerWidth - 32 - 30, 540);
  S = Math.max(34, Math.floor(avail / N));
  const px = S * N, dpr = window.devicePixelRatio || 1;
  cv.style.width = cv.style.height = px + 'px';
  cv.width = cv.height = Math.round(px * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  $('hud').style.width = (px + 30) + 'px';
}
window.addEventListener('resize', resize);

// ---------- helpers ----------
const rnd = n => Math.floor(Math.random() * n);
const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const settle = () => new Promise(r => waiters.push(r));
function mk(t, sp, c, y) { return { t, sp: sp || 0, x: c, y, pop: 1, vy: 0, lin: false, land: 0 }; }

// ---------- sound ----------
function tone(f, d = 0.12, type = 'sine', v = 0.12, delay = 0) {
  if (!sound || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + delay;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
function sMatch(k) {
  const b = 440 * Math.pow(1.122, Math.min(k - 1, 10));
  tone(b, .15, 'triangle', .14); tone(b * 1.26, .15, 'triangle', .11, .06); tone(b * 1.5, .2, 'triangle', .1, .12);
}
const sSwap = () => tone(330, .08, 'sine', .08);
const sBad = () => { tone(180, .12, 'square', .05); tone(140, .15, 'square', .05, .08); };
const sBoom = () => { tone(110, .3, 'sawtooth', .08); tone(880, .25, 'triangle', .08, .05); };
function sWin() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'triangle', .12, i * .12)); }

// ---------- board ----------
function fillBoard() {
  board = [];
  for (let r = 0; r < N; r++) {
    const row = [];
    for (let c = 0; c < N; c++) {
      let t;
      do { t = rnd(T); } while (
        (c >= 2 && row[c-1].t === t && row[c-2].t === t) ||
        (r >= 2 && board[r-1][c].t === t && board[r-2][c].t === t) ||
        (r >= 1 && c >= 1 && row[c-1].t === t && board[r-1][c].t === t && board[r-1][c-1].t === t));
      row.push(mk(t, 0, c, r - N - 1));
    }
    board.push(row);
  }
  if (!findHint()) fillBoard();
}

function findRuns() {
  const runs = [];
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      const g = board[r][c]; let e = c + 1;
      if (g && g.t < T) {
        while (e < N && board[r][e] && board[r][e].t === g.t) e++;
        if (e - c >= 3) { const cells = []; for (let k = c; k < e; k++) cells.push([r, k]); runs.push({ cells, dir: 'h', t: g.t }); }
      }
      c = e;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      const g = board[r][c]; let e = r + 1;
      if (g && g.t < T) {
        while (e < N && board[e][c] && board[e][c].t === g.t) e++;
        if (e - r >= 3) { const cells = []; for (let k = r; k < e; k++) cells.push([k, c]); runs.push({ cells, dir: 'v', t: g.t }); }
      }
      r = e;
    }
  }
  // 2x2 사각형
  for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
    const g = board[r][c];
    if (!g || g.t >= T) continue;
    const cells = [[r, c], [r, c+1], [r+1, c], [r+1, c+1]];
    if (cells.every(([y, x]) => board[y][x] && board[y][x].t === g.t)) runs.push({ cells, dir: 'sq', t: g.t, sq: true });
  }
  return runs;
}

function swapArr(a, b) { const t = board[a[0]][a[1]]; board[a[0]][a[1]] = board[b[0]][b[1]]; board[b[0]][b[1]] = t; }

function findHint() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
    if (board[r][c] && board[r][c].sp === 'c') {
      const n = [[r, c+1], [r, c-1], [r+1, c], [r-1, c]].find(([a, b]) => inB(a, b));
      return [[r, c], n];
    }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc; if (!inB(r2, c2)) continue;
      swapArr([r, c], [r2, c2]); const ok = findRuns().length > 0; swapArr([r, c], [r2, c2]);
      if (ok) return [[r, c], [r2, c2]];
    }
  return null;
}

function mostCommon() {
  const cnt = Array(T).fill(0);
  board.forEach(row => row.forEach(g => { if (g && g.t < T) cnt[g.t]++; }));
  return cnt.indexOf(Math.max(...cnt));
}

function shuffleBoard() {
  const gems = board.flat();
  for (let tries = 0; tries < 300; tries++) {
    for (let i = gems.length - 1; i > 0; i--) { const j = rnd(i + 1); [gems[i], gems[j]] = [gems[j], gems[i]]; }
    for (let i = 0; i < gems.length; i++) board[i / N | 0][i % N] = gems[i];
    if (!findRuns().length && findHint()) return;
  }
  fillBoard();
}

// ---------- core game flow ----------
async function clearCells(set, creates = []) {
  const q = [...set.keys()];
  let boom = false;
  while (q.length) {
    const k = q.pop(), r = k / N | 0, c = k % N, g = board[r][c];
    if (!g || !g.sp || g.fired) continue;
    g.fired = true; boom = true;
    const tg = [];
    if (g.sp === 'h') { for (let x = 0; x < N; x++) tg.push(r * N + x); fx.push({ k: 'h', r, life: 1 }); }
    else if (g.sp === 'v') { for (let y = 0; y < N; y++) tg.push(y * N + c); fx.push({ k: 'v', c, life: 1 }); }
    else if (g.sp === 'a') {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (inB(r+dr, c+dc)) tg.push((r+dr) * N + c + dc);
      fx.push({ k: 'ring', r, c, life: 1 });
    } else if (g.sp === 'c') {
      const col = g.target != null ? g.target : mostCommon();
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (board[y][x] && board[y][x].t === col) tg.push(y * N + x);
      fx.push({ k: 'zap', r, c, to: tg.map(t => [t / N | 0, t % N]), life: 1 });
    }
    tg.forEach(t => { if (!set.has(t)) { set.set(t, 1); q.push(t); } });
  }
  let n = 0, sx = 0, sy = 0;
  set.forEach((_, k) => {
    const r = k / N | 0, c = k % N, g = board[r][c];
    if (!g) return;
    n++; sx += c; sy += r;
    dying.push({ g, p: 0 }); burst(c, r, g.t);
    board[r][c] = null;
  });
  creates.forEach(o => { const g = mk(o.t, o.sp, o.c, o.r); g.pop = 0; board[o.r][o.c] = g; });
  const mult = Math.max(1, combo);
  const pts = n * 30 * mult + creates.length * 120;
  score += pts;
  if (n) texts.push({ x: sx / n, y: sy / n, s: '+' + pts, life: 1, big: mult > 1 });
  if (combo > 1) texts.push({ x: N / 2 - 0.5, y: N / 2 - 1, s: combo + ' 콤보!', life: 1.2, big: true, col: '#ffef7a' });
  sMatch(combo || 1); if (boom) sBoom();
  updateHud();
  await settle();
}

async function gravity() {
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      if (board[r][c]) { if (r !== w) { board[w][c] = board[r][c]; board[r][c] = null; } w--; }
    }
    const missing = w + 1;
    for (let r = w; r >= 0; r--) board[r][c] = mk(rnd(T), 0, c, r - missing);
  }
  await settle();
}

async function resolve(sw) {
  combo = 0;
  for (;;) {
    const runs = findRuns();
    if (!runs.length) break;
    combo++;
    const set = new Map(), creates = [], cnt = {};
    runs.forEach(run => run.cells.forEach(([r, c]) => { const k = r * N + c; if (!run.sq) cnt[k] = (cnt[k] || 0) + 1; set.set(k, 1); }));
    runs.filter(run => run.sq).forEach(run => fx.push({ k: 'sq', r: run.cells[0][0], c: run.cells[0][1], life: 1 }));
    const usedRun = new Set(), taken = new Set();
    for (const key in cnt) {
      if (cnt[key] < 2) continue;
      const kk = +key;
      const idx = runs.map((run, i) => run.cells.some(([r, c]) => r * N + c === kk) ? i : -1).filter(i => i >= 0);
      if (idx.some(i => runs[i].cells.length >= 5 || usedRun.has(i))) continue;
      idx.forEach(i => usedRun.add(i)); taken.add(kk);
      creates.push({ r: kk / N | 0, c: kk % N, t: runs[idx[0]].t, sp: 'a' });
    }
    runs.forEach((run, i) => {
      if (run.sq || usedRun.has(i) || run.cells.length < 4) return;
      const p = run.cells.find(([r, c]) => sw.some(s => s[0] === r && s[1] === c) && !taken.has(r * N + c))
             || run.cells[run.cells.length >> 1];
      const k = p[0] * N + p[1]; if (taken.has(k)) return; taken.add(k);
      const five = run.cells.length >= 5;
      creates.push({ r: p[0], c: p[1], t: five ? T : run.t, sp: five ? 'c' : run.dir });
    });
    await clearCells(set, creates);
    await gravity();
    sw = [];
  }
}

async function trySwap(a, b) {
  busy = true; sel = null; showHint = false; hint = null;
  const ga = board[a[0]][a[1]], gb = board[b[0]][b[1]];
  swapArr(a, b); ga.lin = gb.lin = true; sSwap();
  await settle();
  if (ga.sp === 'c' || gb.sp === 'c') {
    moves--; updateHud(); combo = 1;
    const set = new Map();
    if (ga.sp === 'c' && gb.sp === 'c') {
      for (let k = 0; k < N * N; k++) set.set(k, 1);
      fx.push({ k: 'ring', r: b[0], c: b[1], life: 1, big: true });
    } else {
      const bomb = ga.sp === 'c' ? ga : gb, other = bomb === ga ? gb : ga;
      const pos = bomb === ga ? b : a;
      bomb.target = other.t;
      if (other.sp) board.forEach(row => row.forEach(g => {
        if (g && g.t === other.t && !g.sp) g.sp = other.sp === 'a' ? 'a' : (Math.random() < .5 ? 'h' : 'v');
      }));
      set.set(pos[0] * N + pos[1], 1);
    }
    await clearCells(set);
    await gravity();
    await resolve([]);
  } else if (findRuns().length) {
    moves--; updateHud();
    await resolve([a, b]);
  } else {
    sBad(); swapArr(a, b); ga.lin = gb.lin = true;
    await settle();
    busy = false; lastAct = performance.now();
    return;
  }
  await endTurn();
}

async function endTurn() {
  updateHud();
  if (score >= target) {
    await sleep(300);
    const bonus = moves * 150;
    if (bonus) { score += bonus; texts.push({ x: N / 2 - 0.5, y: N / 2, s: '남은 이동 보너스 +' + bonus, life: 1.5, big: true, col: '#bff' }); updateHud(); await sleep(900); }
    const ratio = score / target, stars = ratio >= 1.8 ? 3 : ratio >= 1.35 ? 2 : 1;
    sWin();
    showOverlay('레벨 클리어!', `점수 ${score.toLocaleString()}점`, '다음 레벨 ▶', () => startLevel(level + 1), stars);
    return;
  }
  if (moves <= 0) {
    showOverlay('아쉬워요!', `목표까지 ${(target - score).toLocaleString()}점 부족했어요.`, '다시 도전', () => startLevel(level));
    return;
  }
  if (!findHint()) {
    texts.push({ x: N / 2 - 0.5, y: N / 2 - 0.5, s: '움직일 수 없어 섞는 중...', life: 1.4, big: true, col: '#fff' });
    await sleep(600); shuffleBoard(); await settle();
    await resolve([]);
  }
  busy = false; lastAct = performance.now();
}

function startLevel(l) {
  level = l; score = 0; combo = 0;
  target = 2500 + (l - 1) * 1500;
  moves = Math.max(16, 26 - l);
  dying = []; parts = []; fx = []; texts = [];
  fillBoard(); hideOverlay(); updateHud();
  sel = null; hint = null; showHint = false;
  busy = true;
  settle().then(() => { busy = false; lastAct = performance.now(); });
}

// ---------- HUD / overlay ----------
function updateHud() {
  $('lv').textContent = level;
  $('sc').textContent = score.toLocaleString();
  $('tg').textContent = target.toLocaleString();
  $('mv').textContent = moves;
  $('fill').style.width = Math.min(100, score / target * 100) + '%';
}
function showOverlay(title, text, btn, fn, stars) {
  busy = true;
  $('ovTitle').textContent = title; $('ovText').textContent = text; $('ovBtn').textContent = btn;
  $('stars').innerHTML = stars ? [1, 2, 3].map(i => `<span class="${i <= stars ? '' : 'off'}">★</span>`).join('') : '';
  $('ovBtn').onclick = fn;
  $('overlay').classList.add('show');
}
function hideOverlay() { $('overlay').classList.remove('show'); }

// ---------- effects ----------
function burst(c, r, t) {
  const col = t < T ? GEM[t].c2 : GOLD, col2 = t < T ? GEM[t].c1 : '#fff';
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * Math.PI * 2, v = 0.04 + Math.random() * 0.08;
    parts.push({ x: c + .5, y: r + .5, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.03, life: 1, col: i % 3 ? col : col2, s: .06 + Math.random() * .08 });
  }
}

// ---------- update / draw ----------
function update() {
  let moving = false;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = board[r][c]; if (!g) continue;
    if (g.x !== c) {
      const d = c - g.x;
      if (Math.abs(d) <= SPD) g.x = c; else g.x += Math.sign(d) * SPD;
      moving = true;
    }
    if (g.y !== r) {
      const d = r - g.y;
      if (d > 0 && !g.lin) {
        g.vy = Math.min(g.vy + 0.02, 0.45);
        if (d <= g.vy) { g.y = r; g.vy = 0; g.land = 1; } else g.y += g.vy;
      } else {
        if (Math.abs(d) <= SPD) g.y = r; else g.y += Math.sign(d) * SPD;
      }
      moving = true;
    }
    if (g.x === c && g.y === r) g.lin = false;
    if (g.pop < 1) { g.pop = Math.min(1, g.pop + 0.07); moving = true; }
    if (g.land > 0) g.land = Math.max(0, g.land - 0.1);
  }
  dying.forEach(d => d.p += 0.075);
  dying = dying.filter(d => d.p < 1);
  if (dying.length) moving = true;
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.004; p.life -= 0.025; });
  parts = parts.filter(p => p.life > 0);
  fx.forEach(f => f.life -= 0.045); fx = fx.filter(f => f.life > 0);
  texts.forEach(t => { t.y -= 0.015; t.life -= 0.016; }); texts = texts.filter(t => t.life > 0);
  return moving;
}

function starPath(ro, ri) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? ri : ro;
    i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
}

function drawCoin(R) {
  ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = S * .3;
  ctx.beginPath(); ctx.arc(0, 0, R * 1.02, 0, Math.PI * 2);
  const gr = ctx.createRadialGradient(-R * .3, -R * .35, R * .1, 0, 0, R * 1.1);
  gr.addColorStop(0, '#fff8c0'); gr.addColorStop(.5, '#ffc414'); gr.addColorStop(1, '#a06400');
  ctx.fillStyle = gr; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = S * .04; ctx.strokeStyle = '#6e4200'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, R * .78, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,250,210,.7)'; ctx.lineWidth = S * .025; ctx.stroke();
  ctx.save(); ctx.rotate(Math.sin(time / 500) * .25);
  starPath(R * .58, R * .24);
  ctx.fillStyle = '#fff3b0'; ctx.fill(); ctx.strokeStyle = '#b07800'; ctx.lineWidth = S * .025; ctx.stroke();
  ctx.restore();
  // shine sweep
  const s = ((time / 900) % 2) - 1;
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.rotate(.5); ctx.fillRect(s * R * 2.4 - R * .15, -R * 1.5, R * .3, R * 3);
  ctx.restore();
}

function drawGem(g, px, py, scale, alpha) {
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(scale * (1 + g.land * .06), scale * (1 - g.land * .08));
  ctx.globalAlpha = alpha;
  const R = S * .4;
  if (g.sp === 'c') { drawCoin(R); ctx.restore(); return; }
  const G = GEM[g.t];
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = S * .08; ctx.shadowOffsetY = S * .05;
  // 주기율표 칸 모양 타일
  roundRect(-R, -R, R * 2, R * 2, R * .28);
  const gr = ctx.createLinearGradient(0, -R, 0, R);
  gr.addColorStop(0, G.c1); gr.addColorStop(.45, G.c2); gr.addColorStop(1, G.c3);
  ctx.fillStyle = gr; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.lineWidth = S * .035; ctx.strokeStyle = G.c3; ctx.stroke();
  roundRect(-R * .84, -R * .84, R * 1.68, R * 1.68, R * .18);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2; ctx.stroke();
  // glossy highlight
  ctx.beginPath(); ctx.ellipse(-R * .1, -R * .62, R * .7, R * .2, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill();
  // atomic number + symbol
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.font = `700 ${Math.round(S * .16)}px 'Segoe UI',sans-serif`;
  ctx.fillText(G.num, -R * .72, -R * .6);
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(S * (G.sym.length > 1 ? .42 : .5))}px 'Segoe UI',Arial,sans-serif`;
  ctx.lineJoin = 'round'; ctx.lineWidth = S * .07; ctx.strokeStyle = G.c3;
  ctx.strokeText(G.sym, 0, R * .14);
  ctx.fillStyle = '#fff'; ctx.fillText(G.sym, 0, R * .14);
  // specials
  if (g.sp === 'h' || g.sp === 'v') {
    ctx.save();
    if (g.sp === 'v') ctx.rotate(Math.PI / 2);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 6;
    for (const y of [-R * .8, R * .8]) ctx.fillRect(-R * .95, y - R * .06, R * 1.9, R * .12);
    // arrows
    ctx.beginPath();
    ctx.moveTo(R * 1.15, 0); ctx.lineTo(R * .85, -R * .2); ctx.lineTo(R * .85, R * .2); ctx.closePath();
    ctx.moveTo(-R * 1.15, 0); ctx.lineTo(-R * .85, -R * .2); ctx.lineTo(-R * .85, R * .2); ctx.closePath();
    ctx.fill();
    ctx.restore();
  } else if (g.sp === 'a') {
    const pulse = .5 + .5 * Math.sin(time / 180);
    roundRect(-R * 1.1, -R * 1.1, R * 2.2, R * 2.2, R * .35);
    ctx.strokeStyle = `rgba(255,235,140,${.55 + .45 * pulse})`; ctx.lineWidth = S * .055;
    ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = S * .25; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(R * .62, -R * .6); ctx.rotate(time / 300);
    starPath(R * .2, R * .08); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function draw() {
  const W = S * N;
  ctx.clearRect(0, 0, W, W);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) % 2 ? 'rgba(255,230,190,.10)' : 'rgba(255,230,190,.20)';
    ctx.fillRect(c * S, r * S, S, S);
  }
  if (sel) {
    const p = .5 + .5 * Math.sin(time / 150);
    roundRect(sel[1] * S + 2, sel[0] * S + 2, S - 4, S - 4, S * .18);
    ctx.fillStyle = `rgba(255,220,100,${.2 + .15 * p})`; ctx.fill();
    ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 3; ctx.stroke();
  }
  // gems
  if (!busy && performance.now() - lastAct > 7000 && !showHint) { hint = findHint(); showHint = true; }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = board[r][c]; if (!g) continue;
    let sc = g.pop < 1 ? easeBack(g.pop) : 1;
    if (sel && sel[0] === r && sel[1] === c) sc *= 1 + .07 * Math.sin(time / 120);
    if (showHint && hint && hint.some(h => h[0] === r && h[1] === c)) sc *= 1 + .1 * Math.abs(Math.sin(time / 220));
    drawGem(g, (g.x + .5) * S, (g.y + .5) * S, sc, 1);
  }
  dying.forEach(d => drawGem(d.g, (d.g.x + .5) * S, (d.g.y + .5) * S, 1 + d.p * .4, 1 - d.p));
  // fx
  fx.forEach(f => {
    ctx.save(); ctx.globalAlpha = Math.max(0, f.life);
    ctx.shadowColor = '#fff7c0'; ctx.shadowBlur = 20; ctx.fillStyle = '#fffbe0';
    if (f.k === 'h') ctx.fillRect(0, f.r * S + S * (.5 - .22 * f.life), W, S * .44 * f.life);
    else if (f.k === 'v') ctx.fillRect(f.c * S + S * (.5 - .22 * f.life), 0, S * .44 * f.life, W);
    else if (f.k === 'sq') {
      const pad = S * .5 * (1 - f.life);
      roundRect(f.c * S - pad, f.r * S - pad, S * 2 + pad * 2, S * 2 + pad * 2, S * .3);
      ctx.strokeStyle = '#fff3a0'; ctx.lineWidth = S * .15 * f.life; ctx.stroke();
    }
    else if (f.k === 'ring') {
      ctx.beginPath(); ctx.arc((f.c + .5) * S, (f.r + .5) * S, (1 - f.life) * S * (f.big ? 8 : 2) + S * .3, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffe680'; ctx.lineWidth = S * .25 * f.life; ctx.stroke();
    } else if (f.k === 'zap') {
      ctx.strokeStyle = '#fff6a0'; ctx.lineWidth = 3;
      const x0 = (f.c + .5) * S, y0 = (f.r + .5) * S;
      f.to.forEach(([r, c]) => {
        const x1 = (c + .5) * S, y1 = (r + .5) * S;
        ctx.beginPath(); ctx.moveTo(x0, y0);
        for (let i = 1; i < 5; i++) ctx.lineTo(x0 + (x1 - x0) * i / 5 + (Math.random() - .5) * S * .4, y0 + (y1 - y0) * i / 5 + (Math.random() - .5) * S * .4);
        ctx.lineTo(x1, y1); ctx.stroke();
      });
    }
    ctx.restore();
  });
  // particles
  parts.forEach(p => {
    ctx.save(); ctx.globalAlpha = p.life; ctx.fillStyle = p.col;
    ctx.translate(p.x * S, p.y * S); ctx.rotate(p.life * 6);
    const s = p.s * S; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  });
  // texts
  texts.forEach(t => {
    ctx.save(); ctx.globalAlpha = Math.min(1, t.life * 1.5);
    ctx.font = `900 ${Math.round(S * (t.big ? .5 : .38))}px 'Malgun Gothic',sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = '#4a2200';
    const x = Math.min(Math.max((t.x + .5) * S, S * 2), W - S * 2), y = (t.y + .5) * S;
    ctx.strokeText(t.s, x, y); ctx.fillStyle = t.col || '#fff'; ctx.fillText(t.s, x, y);
    ctx.restore();
  });
}
function easeBack(t) { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

function frame(t) {
  time = t;
  const moving = update();
  draw();
  if (!moving && waiters.length) { const w = waiters; waiters = []; w.forEach(f => f()); }
  requestAnimationFrame(frame);
}

// ---------- input ----------
function cellAt(e) {
  const rc = cv.getBoundingClientRect();
  return [Math.floor((e.clientY - rc.top) / S), Math.floor((e.clientX - rc.left) / S)];
}
function unlockAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
cv.addEventListener('pointerdown', e => {
  unlockAudio();
  if (busy) return;
  const [r, c] = cellAt(e);
  if (!inB(r, c)) return;
  lastAct = performance.now(); showHint = false;
  if (sel && Math.abs(sel[0] - r) + Math.abs(sel[1] - c) === 1) { const a = sel; sel = null; trySwap(a, [r, c]); return; }
  sel = (sel && sel[0] === r && sel[1] === c) ? null : [r, c];
  drag = { x: e.clientX, y: e.clientY, r, c };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag || busy) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < S * .4) return;
  const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
  const a = [drag.r, drag.c], b = [drag.r + dr, drag.c + dc];
  drag = null;
  if (inB(b[0], b[1])) { sel = null; trySwap(a, b); }
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

$('restartBtn').onclick = () => { unlockAudio(); if (busy && !$('overlay').classList.contains('show')) return; startLevel(level); };
$('hintBtn').onclick = () => { unlockAudio(); if (busy) return; hint = findHint(); showHint = true; };
$('soundBtn').onclick = () => { unlockAudio(); sound = !sound; $('soundBtn').textContent = sound ? '🔊 소리' : '🔇 소리'; };

resize();
startLevel(1);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
